        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Deal is already closed

  # ─── ACTIVITIES ────────────────────────────────────────────────────────────

  /api/activities:
    get:
      tags: [Activities]
      summary: List activities and tasks
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/ownerId'
        - name: done
          in: query
          schema: { type: boolean }
          description: true = logged activities, false = pending tasks
        - name: dealId
          in: query
          schema: { type: string, format: uuid }
        - name: contactId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [call, email, meeting, demo, lunch, other] }
        - name: overdue
          in: query
          schema: { type: boolean }
          description: Filter to tasks with due_date in the past
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Activities]
      summary: Log an activity or schedule a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/activities/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Activities]
      summary: Get an activity by ID
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Activities]
      summary: Update an activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Activities]
      summary: Soft-delete an activity (admin only)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/activities/{id}/done:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      tags: [Activities]
      summary: Mark a task as done
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, maxLength: 500 }
                doneAt: { type: string, format: date-time, description: Defaults to now }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Activity is already marked done

  # ─── NOTES ─────────────────────────────────────────────────────────────────

  /api/notes:
    get:
      tags: [Notes]
      summary: List notes filtered by record type
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: dealId
          in: query
          schema: { type: string, format: uuid }
        - name: contactId
          in: query
          schema: { type: string, format: uuid }
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
        - name: leadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Note' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Notes]
      summary: Add a note to a record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteRequest' }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notes/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    put:
      tags: [Notes]
      summary: Update a note (author or admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNoteRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notes]
      summary: Soft-delete a note (author or admin only)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── REPORTS ───────────────────────────────────────────────────────────────

  /api/reports/deals-summary:
    get:
      tags: [Reports]
      summary: Won/lost deal counts and values by period (manager / admin only)
      parameters:
        - name: from
          in: query
