openapi: 3.1.0

info:
  title: CRM API
  version: 0.1.0
  description: |
    REST API for the Spec-Driven CRM project.

    **Auth**: All endpoints require `Authorization: Bearer <token>` unless marked `[public]`.
    **Envelope**: Single records return `{ "data": {...} }`. Lists return `{ "data": [...], "pagination": {...} }`.
    **Errors**: All errors return `{ "error": "CODE", "message": "...", "details": [] }`.
    **Tenant**: All data is scoped by `organizationId` extracted from the JWT — never passed in the request.
    **Soft delete**: DELETE endpoints set `deletedAt`; records are never hard-deleted.

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.your-crm.com
    description: Production

security:
  - bearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Reusable parameters ────────────────────────────────────────────────────

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
      description: Page number
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Items per page
    sort:
      name: sort
      in: query
      schema: { type: string, default: createdAt }
      description: Field to sort by
    order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
      description: Sort direction
    search:
      name: search
      in: query
      schema: { type: string }
      description: Full-text search across name / title fields
    ownerId:
      name: ownerId
      in: query
      schema: { type: string, format: uuid }
      description: Filter by owner (manager / admin only)

  # ── Shared schemas ─────────────────────────────────────────────────────────

  schemas:

    # ── Primitives ──────────────────────────────────────────────────────────

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 142 }
        totalPages: { type: integer, example: 8 }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: NOT_FOUND }
        message: { type: string, example: Contact not found. }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ── Auth ────────────────────────────────────────────────────────────────

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string, example: Sam Lee }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, manager, sales_rep] }
        avatarUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string, description: JWT access token }
            user: { $ref: '#/components/schemas/UserProfile' }

    # ── Users ───────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, manager, sales_rep] }
        avatarUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        invitedBy: { type: string, format: uuid, nullable: true }
        inviteAcceptedAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, manager, sales_rep] }
        name: { type: string }

    AcceptInviteRequest:
      type: object
      required: [token, name, password]
      properties:
        token: { type: string }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, manager, sales_rep] }
        isActive: { type: boolean }
        avatarUrl: { type: string }

    # ── Contacts ────────────────────────────────────────────────────────────

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        companyId: { type: string, format: uuid, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        jobTitle: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        source: { type: string, enum: [manual, import, web_form, api, lead_conversion] }
        companyName: { type: string, nullable: true, description: Eagerly loaded from company }
        ownerName: { type: string, description: Eagerly loaded from user }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContactRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        jobTitle: { type: string, maxLength: 255 }
        linkedinUrl: { type: string, format: uri }
        companyId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, description: Defaults to the requesting user }

    UpdateContactRequest:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        jobTitle: { type: string, maxLength: 255 }
        linkedinUrl: { type: string, format: uri }
        companyId: { type: string, format: uuid, nullable: true }
        ownerId: { type: string, format: uuid, description: Manager/admin only }

    # ── Companies ───────────────────────────────────────────────────────────

    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        employeeCount: { type: integer, nullable: true }
        annualRevenue: { type: number, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        website: { type: string, nullable: true }
        contactCount: { type: integer, description: Eagerly loaded }
        ownerName: { type: string, description: Eagerly loaded }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        domain: { type: string }
        industry: { type: string }
        employeeCount: { type: integer, minimum: 0 }
        annualRevenue: { type: number, minimum: 0 }
        country: { type: string }
        city: { type: string }
        address: { type: string }
        website: { type: string, format: uri }
        ownerId: { type: string, format: uuid }

    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        domain: { type: string }
        industry: { type: string }
        employeeCount: { type: integer, minimum: 0 }
        annualRevenue: { type: number, minimum: 0 }
        country: { type: string }
        city: { type: string }
        address: { type: string }
        website: { type: string, format: uri }
        ownerId: { type: string, format: uuid, description: Manager/admin only }

    # ── Leads ────────────────────────────────────────────────────────────────

    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        contactId: { type: string, format: uuid, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        value: { type: number, example: 5000.00 }
        status: { type: string, enum: [new, contacted, qualified, disqualified, converted] }
        source: { type: string, enum: [manual, import, web_form, api, referral, other] }
        expectedCloseDate: { type: string, format: date, nullable: true }
        convertedDealId: { type: string, format: uuid, nullable: true }
        convertedAt: { type: string, format: date-time, nullable: true }
        contactName: { type: string, nullable: true, description: Eagerly loaded }
        companyName: { type: string, nullable: true, description: Eagerly loaded }
        ownerName: { type: string, description: Eagerly loaded }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateLeadRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        value: { type: number, minimum: 0, default: 0 }
        source: { type: string, enum: [manual, import, web_form, api, referral, other], default: manual }
        contactId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        expectedCloseDate: { type: string, format: date }
        ownerId: { type: string, format: uuid, description: Defaults to requesting user }

    UpdateLeadRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        value: { type: number, minimum: 0 }
        status: { type: string, enum: [new, contacted, qualified, disqualified] }
        source: { type: string, enum: [manual, import, web_form, api, referral, other] }
        contactId: { type: string, format: uuid, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        expectedCloseDate: { type: string, format: date, nullable: true }
        ownerId: { type: string, format: uuid, description: Manager/admin only }

    ConvertLeadRequest:
      type: object
      required: [stageId]
      properties:
        stageId: { type: string, format: uuid, description: Pipeline stage to place the new deal in }
        dealTitle: { type: string, description: Defaults to the lead title }
        dealValue: { type: number, description: Defaults to the lead value }
        expectedCloseDate: { type: string, format: date }
        createContact: { type: boolean, default: false, description: Create a Contact from lead data if not already linked }
        createCompany: { type: boolean, default: false, description: Create a Company from lead data if not already linked }

    # ── Pipelines ────────────────────────────────────────────────────────────

    Pipeline:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        displayOrder: { type: integer }
        stages:
          type: array
          items: { $ref: '#/components/schemas/PipelineStage' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PipelineStage:
      type: object
      properties:
        id: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        displayOrder: { type: integer }
        probability: { type: integer, minimum: 0, maximum: 100 }
        dealCount: { type: integer, description: Open deals in this stage — eagerly loaded }
        dealValue: { type: number, description: Total value of open deals — eagerly loaded }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePipelineStageRequest:
      type: object
      required: [name, displayOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        displayOrder: { type: integer, minimum: 0 }
        probability: { type: integer, minimum: 0, maximum: 100, default: 0 }

    UpdatePipelineStageRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        displayOrder: { type: integer, minimum: 0 }
        probability: { type: integer, minimum: 0, maximum: 100 }

    ReorderStagesRequest:
      type: object
      required: [stageIds]
      properties:
        stageIds:
          type: array
          items: { type: string, format: uuid }
          description: Stage IDs in the desired display order

    # ── Deals ────────────────────────────────────────────────────────────────

    Deal:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        companyId: { type: string, format: uuid, nullable: true }
        leadId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        value: { type: number }
        status: { type: string, enum: [open, won, lost] }
        lostReason: { type: string, nullable: true }
        expectedCloseDate: { type: string, format: date, nullable: true }
        wonAt: { type: string, format: date-time, nullable: true }
        lostAt: { type: string, format: date-time, nullable: true }
        stageName: { type: string, description: Eagerly loaded }
        contactName: { type: string, description: Eagerly loaded }
        companyName: { type: string, nullable: true, description: Eagerly loaded }
        ownerName: { type: string, description: Eagerly loaded }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDealRequest:
      type: object
      required: [title, contactId, stageId]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        contactId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        value: { type: number, minimum: 0, default: 0 }
        expectedCloseDate: { type: string, format: date }
        ownerId: { type: string, format: uuid, description: Defaults to requesting user }

    UpdateDealRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        stageId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        companyId: { type: string, format: uuid, nullable: true }
        value: { type: number, minimum: 0 }
        expectedCloseDate: { type: string, format: date, nullable: true }
        ownerId: { type: string, format: uuid, description: Manager/admin only }

    MarkDealLostRequest:
      type: object
      required: [lostReason]
      properties:
        lostReason: { type: string, minLength: 1, maxLength: 500 }

    # ── Activities ───────────────────────────────────────────────────────────

    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        leadId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [call, email, meeting, demo, lunch, other] }
        subject: { type: string }
        note: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        dueTime: { type: string, pattern: '^[0-2]\d:[0-5]\d$', nullable: true }
        durationMinutes: { type: integer, minimum: 1, nullable: true }
        ownerName: { type: string, description: Eagerly loaded }
        dealTitle: { type: string, nullable: true, description: Eagerly loaded }
        contactName: { type: string, nullable: true, description: Eagerly loaded }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateActivityRequest:
      type: object
      required: [type, subject]
      properties:
        type: { type: string, enum: [call, email, meeting, demo, lunch, other] }
        subject: { type: string, minLength: 1, maxLength: 255 }
        note: { type: string }
        outcome: { type: string, maxLength: 500 }
        done: { type: boolean, default: false }
        doneAt: { type: string, format: date-time, description: Defaults to now when done is true }
        dueDate: { type: string, format: date, description: Required when done is false }
        dueTime: { type: string, pattern: '^[0-2]\d:[0-5]\d$' }
        durationMinutes: { type: integer, minimum: 1 }
        dealId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, description: Defaults to requesting user }

    UpdateActivityRequest:
      type: object
      properties:
        type: { type: string, enum: [call, email, meeting, demo, lunch, other] }
        subject: { type: string, minLength: 1, maxLength: 255 }
        note: { type: string }
        outcome: { type: string, maxLength: 500 }
        dueDate: { type: string, format: date }
        dueTime: { type: string, pattern: '^[0-2]\d:[0-5]\d$' }
        durationMinutes: { type: integer, minimum: 1 }
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        leadId: { type: string, format: uuid, nullable: true }

    # ── Notes ────────────────────────────────────────────────────────────────

    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        leadId: { type: string, format: uuid, nullable: true }
        content: { type: string }
        isPinned: { type: boolean }
        authorName: { type: string, description: Eagerly loaded }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNoteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        isPinned: { type: boolean, default: false }
        dealId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }

    UpdateNoteRequest:
      type: object
      properties:
        content: { type: string, minLength: 1 }
        isPinned: { type: boolean }

    # ── Reports ──────────────────────────────────────────────────────────────

    DealsSummaryReport:
      type: object
      properties:
        data:
          type: object
          properties:
            won: { type: object, properties: { count: { type: integer }, totalValue: { type: number } } }
            lost: { type: object, properties: { count: { type: integer }, totalValue: { type: number } } }
            open: { type: object, properties: { count: { type: integer }, totalValue: { type: number } } }
            byOwner:
              type: array
              items:
                type: object
                properties:
                  ownerId: { type: string, format: uuid }
                  ownerName: { type: string }
                  wonCount: { type: integer }
                  wonValue: { type: number }
                  lostCount: { type: integer }
                  openCount: { type: integer }

    PipelineValueReport:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              stageId: { type: string, format: uuid }
              stageName: { type: string }
              displayOrder: { type: integer }
              dealCount: { type: integer }
              totalValue: { type: number }
              weightedValue: { type: number, description: totalValue * (probability / 100) }

    ActivitiesSummaryReport:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              ownerId: { type: string, format: uuid }
              ownerName: { type: string }
              total: { type: integer }
              byType:
                type: object
                properties:
                  call: { type: integer }
                  email: { type: integer }
                  meeting: { type: integer }
                  demo: { type: integer }
                  lunch: { type: integer }
                  other: { type: integer }

    LeadsBySourceReport:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              total: { type: integer }
              converted: { type: integer }
              conversionRate: { type: number, description: converted / total as percentage }

  # ── Reusable responses ──────────────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UNAUTHORIZED, message: Invalid or expired token. }
    Forbidden:
      description: Insufficient permissions for this role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: FORBIDDEN, message: You do not have permission to perform this action. }
    NotFound:
      description: Resource not found in this organisation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NOT_FOUND, message: Resource not found. }
    ValidationError:
      description: Request body failed Zod validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: VALIDATION_ERROR
            message: Invalid request data.
            details:
              - { field: email, message: Invalid email address. }
    Conflict:
      description: Unique constraint violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: CONFLICT, message: A record with this value already exists. }
    NoContent:
      description: Success — no body returned

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new organisation and admin user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, organizationName]
              properties:
                organizationName: { type: string, minLength: 1, maxLength: 255 }
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Organisation and admin user created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
